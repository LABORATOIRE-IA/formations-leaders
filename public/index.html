<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Formation Offre Lab — Inscriptions</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap');

  :root{
    --bg:#FFFFFF;
    --bg2:#F6F7FB;
    --panel:rgba(20,24,40,0.03);
    --panel-line:rgba(20,24,40,0.09);
    --panel-line-strong:rgba(20,24,40,0.16);
    --ink:#161A26;
    --body:#5A6178;
    --cyan:#0E8F94;
    --violet:#7B4C93;
    --amber:#C8642B;
    --line:rgba(20,24,40,0.07);
    --ok:#1F8F5C;
    --ok-bg:rgba(31,143,92,0.08);
    --full:#C8642B;
    --full-bg:rgba(200,100,43,0.10);
    color-scheme: light;
  }

  *{box-sizing:border-box;}
  html,body{ background:var(--bg); }
  body{
    background:var(--bg);
    color:var(--body);
    font-family:'Space Grotesk',system-ui,sans-serif;
    margin:0;
    padding-inline:20px;
    padding-block:0 64px;
    display:flex;
    justify-content:center;
    position:relative;
    overflow-x:hidden;
  }

  body::before{
    content:'';
    position:fixed;
    inset:0;
    z-index:0;
    background-image:
      linear-gradient(var(--line) 1px, transparent 1px),
      linear-gradient(90deg, var(--line) 1px, transparent 1px);
    background-size:56px 56px;
    mask-image:radial-gradient(1100px 700px at 50% 0%, black, transparent 75%);
    opacity:0.55;
    pointer-events:none;
  }

  main{ width:100%; max-width:900px; position:relative; z-index:1; }

  .wordmark{ display:flex; align-items:center; justify-content:center; padding-top:44px; margin-bottom:6px; }
  .wordmark span{ font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:15px; letter-spacing:-0.01em; color:var(--ink); }
  .wordmark .dot{ color:var(--cyan); }
  .signature{ text-align:center; font-family:'JetBrains Mono',monospace; font-weight:500; font-size:10px; letter-spacing:0.18em; text-transform:uppercase; color:var(--body); opacity:0.7; margin:0 0 44px; }

  header{ text-align:center; margin-bottom:40px; }

  h1{ font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:clamp(30px,5.4vw,46px); line-height:1.08; letter-spacing:-0.01em; margin:0 0 18px; text-wrap:balance; color:var(--ink); }
  h1 .accent{ background:linear-gradient(100deg, var(--cyan) 0%, var(--violet) 55%, var(--amber) 100%); -webkit-background-clip:text; background-clip:text; color:transparent; }
  header p.lede{ font-size:16px; line-height:1.65; max-width:56ch; margin:0 auto; color:var(--body); }
  header p.lede strong{ color:var(--ink); font-weight:600; }

  .days{ display:grid; grid-template-columns:1fr 1fr; gap:20px; margin-top:8px; }
  @media (max-width:640px){ .days{grid-template-columns:1fr;} }

  .day-col{ background:var(--panel); border:1px solid var(--panel-line); border-radius:18px; padding:20px; backdrop-filter:blur(6px); }
  .day-header{ display:flex; align-items:baseline; justify-content:space-between; margin-bottom:16px; padding-bottom:14px; border-bottom:1px solid var(--panel-line); }
  .day-name{ font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:15px; color:var(--ink); margin:0; text-transform:uppercase; letter-spacing:0.03em; }
  .day-date{ font-family:'JetBrains Mono',monospace; font-weight:500; font-size:11px; color:var(--body); opacity:0.8; }

  .slot-card{ background:rgba(0,0,0,0.015); border:1px solid var(--panel-line); border-radius:14px; padding:16px; margin-bottom:12px; transition:border-color 0.2s ease; }
  .slot-card:last-child{ margin-bottom:0; }
  .slot-card:hover{ border-color:var(--panel-line-strong); }

  .slot-top{ display:flex; align-items:center; justify-content:space-between; gap:12px; }
  .slot-time{ font-family:'JetBrains Mono',monospace; font-weight:600; font-size:17px; color:var(--ink); font-variant-numeric:tabular-nums; }
  .slot-time .arrow{ color:var(--cyan); opacity:0.85; font-weight:400; margin:0 5px; }

  .slot-status{ font-family:'JetBrains Mono',monospace; font-size:11px; font-weight:600; padding:4px 10px; border-radius:100px; white-space:nowrap; font-variant-numeric:tabular-nums; letter-spacing:0.02em; }
  .slot-status.open{ background:var(--ok-bg); color:var(--ok); }
  .slot-status.full{ background:var(--full-bg); color:var(--full); }

  .capacity-track{ height:5px; border-radius:100px; background:var(--line); margin-top:12px; overflow:hidden; }
  .capacity-fill{ height:100%; border-radius:100px; background:linear-gradient(90deg, var(--cyan), var(--violet)); box-shadow:0 0 10px rgba(14,143,148,0.3); transition:width 0.4s ease; }
  .capacity-fill.full{ background:var(--amber); box-shadow:0 0 10px rgba(200,100,43,0.3); }

  .slot-action{ margin-top:14px; }

  button.reserve{ font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:13.5px; color:#FFFFFF; background:linear-gradient(100deg, var(--cyan), var(--violet)); border:none; border-radius:10px; padding:10px 16px; cursor:pointer; transition:filter 0.15s ease, transform 0.1s ease; width:100%; }
  button.reserve:hover{ filter:brightness(1.1); }
  button.reserve:active{ transform:translateY(1px); }
  button.reserve:disabled{ background:var(--line); color:var(--body); opacity:0.6; cursor:not-allowed; box-shadow:none; }

  .confirmed-tag{ display:flex; align-items:center; justify-content:center; gap:7px; font-family:'JetBrains Mono',monospace; font-size:12.5px; font-weight:600; color:var(--ok); background:var(--ok-bg); border:1px solid rgba(31,143,92,0.25); border-radius:10px; padding:10px 12px; text-align:center; }
  .confirmed-tag svg{ width:15px; height:15px; flex:none; }

  .confirmed-wrap{ display:flex; flex-direction:column; gap:8px; }
  button.unregister{ font-family:'JetBrains Mono',monospace; font-weight:500; font-size:11px; color:var(--body); background:transparent; border:1px solid var(--panel-line); border-radius:8px; padding:6px 10px; cursor:pointer; }
  button.unregister:hover{ border-color:var(--panel-line-strong); color:var(--ink); }

  form.signup{ margin-top:14px; display:flex; flex-direction:column; gap:10px; border-top:1px dashed var(--panel-line); padding-top:14px; }
  .field{ display:flex; flex-direction:column; gap:4px; }
  .field label{ font-family:'JetBrains Mono',monospace; font-size:10.5px; font-weight:500; color:var(--body); letter-spacing:0.05em; text-transform:uppercase; }
  .field input{ font-family:'Space Grotesk',sans-serif; font-size:14px; color:var(--ink); background:rgba(0,0,0,0.02); border:1px solid var(--panel-line); border-radius:9px; padding:9px 11px; outline:none; }
  .field input:focus{ border-color:var(--cyan); box-shadow:0 0 0 3px rgba(14,143,148,0.14); }
  .form-buttons{ display:flex; gap:8px; margin-top:2px; }
  .form-buttons button.reserve{ width:auto; flex:1; }
  button.cancel{ font-family:'Space Grotesk',sans-serif; font-weight:500; font-size:13px; color:var(--body); background:transparent; border:1px solid var(--panel-line); border-radius:9px; padding:8px 14px; cursor:pointer; }
  .error-msg{ font-family:'JetBrains Mono',monospace; font-size:12px; color:var(--amber); font-weight:500; margin:0; }

  footer{ margin-top:40px; text-align:center; }
  .pilotage-gate{ margin-top:14px; display:flex; justify-content:center; }
  button.pilotage-btn{ font-family:'JetBrains Mono',monospace; font-weight:500; font-size:11px; letter-spacing:0.04em; color:var(--body); background:transparent; border:1px dashed var(--panel-line-strong); border-radius:100px; padding:7px 16px; cursor:pointer; }
  button.pilotage-btn:hover{ color:var(--ink); border-color:var(--cyan); }

  .admin{ margin-top:52px; background:var(--panel); border:1px solid var(--panel-line); border-radius:18px; padding:22px; }
  .admin-head{ display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:16px; flex-wrap:wrap; }
  .admin-title{ display:flex; align-items:center; gap:8px; font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:14px; color:var(--ink); text-transform:uppercase; letter-spacing:0.03em; }
  .admin-title .badge{ font-family:'JetBrains Mono',monospace; font-size:10px; font-weight:600; color:#fff; background:var(--amber); padding:2px 8px; border-radius:100px; letter-spacing:0.03em; }
  table.roster{ width:100%; border-collapse:collapse; font-family:'JetBrains Mono',monospace; font-size:12.5px; }
  table.roster th{ text-align:left; font-weight:500; color:var(--body); text-transform:uppercase; font-size:10px; letter-spacing:0.05em; padding:8px 10px; border-bottom:1px solid var(--panel-line-strong); }
  table.roster td{ padding:9px 10px; border-bottom:1px solid var(--panel-line); color:var(--ink); vertical-align:middle; }
  table.roster tr:last-child td{ border-bottom:none; }
  table.roster .muted{ color:var(--body); }
  button.del{ font-family:'JetBrains Mono',monospace; font-size:11px; font-weight:600; color:var(--full); background:var(--full-bg); border:1px solid rgba(200,100,43,0.3); border-radius:8px; padding:5px 9px; cursor:pointer; }
  button.del:hover{ filter:brightness(1.1); }
  .admin-empty{ font-family:'JetBrains Mono',monospace; font-size:12.5px; color:var(--body); padding:8px 0; }
  .table-wrap{ overflow-x:auto; }
</style>
</head>
<body>
<main>
  <p class="wordmark"><span>ailab<span class="dot">.</span></span></p>
  <p class="signature">by onepoint · agentic studio</p>

  <header>
    <h1>Formation à l'offre du Lab<br><span class="accent">15 &amp; 16 octobre</span></h1>
    <p class="lede">Réservez votre créneau : une session pour préparer vos pitchs clients. Sessions de <strong>45 minutes</strong>, <strong>20 places</strong> par créneau.</p>
  </header>

  <div class="days" id="days"></div>

  <footer>
    <div class="pilotage-gate">
      <button class="pilotage-btn" id="pilotage-btn" type="button">Mode pilotage</button>
    </div>
  </footer>

  <div class="admin" id="admin-panel" hidden>
    <div class="admin-head">
      <p class="admin-title">Pilotage <span class="badge">admin</span></p>
      <button class="cancel" id="export-btn" type="button">Exporter la liste (CSV)</button>
    </div>
    <div class="table-wrap">
      <table class="roster" id="roster-table">
        <thead><tr><th>Créneau</th><th>Nom</th><th>Email</th><th>Business Team</th><th></th></tr></thead>
        <tbody id="roster-body"></tbody>
      </table>
      <p class="admin-empty" id="roster-empty" hidden>Aucune inscription pour l'instant.</p>
    </div>
  </div>
</main>

<script src="app.js"></script>
</body>
</html>
